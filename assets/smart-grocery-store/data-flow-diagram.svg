<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650" role="img" aria-label="Data Flow Diagram (DFD Level 1)">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="55%" stop-color="#0d172a"/>
      <stop offset="100%" stop-color="#081120"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13223b"/>
      <stop offset="100%" stop-color="#0f1b30"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.10"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#fbbf24"/>
    </marker>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1400" height="650" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1400" height="650" rx="16" fill="url(#gridPattern)"/>
  <rect x="1" y="1" width="1398" height="648" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <rect x="24" y="20" width="1352" height="74" rx="12" fill="url(#headerGrad)" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="24" y="20" width="6" height="74" rx="3" fill="url(#accentBlue)"/>
  <text x="46" y="51" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Data Flow Diagram (DFD Level 1)</text>
  <text x="46" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">Data movement between Store Owner, procedural operations, and in-memory collections D1 &amp; D2</text>

  <rect x="1165" y="38" width="188" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="1259" y="59" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">Python 3 • Procedural CLI</text>

  <rect x="30" y="220" width="215" height="225" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="30" y="220" width="215" height="36" rx="10" fill="#0c2d48"/>
  <text x="137" y="243" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">EXTERNAL ENTITY</text>
  <text x="137" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">Store Owner / User</text>
  <text x="137" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Enters menu choices,</text>
  <text x="137" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">product &amp; stock inputs,</text>
  <text x="137" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">search &amp; sale qty</text>
  <text x="137" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Views lists, receipts,</text>
  <text x="137" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">alerts &amp; reports</text>
  <rect x="360" y="122" width="440" height="145" rx="72" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="580" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">PROCESS 1.0</text>
  <text x="580" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Catalog, Search &amp; Stock Management</text>
  <text x="580" y="200" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="400" fill="#7dd3fc">add_product() • display_products()</text>
  <text x="580" y="218" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="400" fill="#7dd3fc">search_product() • update_stock() • find_product()</text>
  <text x="580" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Validates fields, checks IDs, mutates product stock</text>
  <rect x="360" y="292" width="440" height="135" rx="67" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.8"/>
  <text x="580" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#34d399">PROCESS 2.0</text>
  <text x="580" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Customer Sale Processing</text>
  <text x="580" y="368" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="400" fill="#6ee7b7">process_sale() • view_sales_records()</text>
  <text x="580" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Verifies stock, deducts qty, computes total,</text>
  <text x="580" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">appends sale dict &amp; displays sales records</text>
  <rect x="360" y="452" width="440" height="132" rx="66" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="580" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">PROCESS 3.0</text>
  <text x="580" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Store Analytics &amp; Report Generation</text>
  <text x="580" y="528" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="400" fill="#fde68a">generate_report()</text>
  <text x="580" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Totals, revenue, low stock (&lt; 5),</text>
  <text x="580" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">highest &amp; lowest priced product</text>
  <rect x="950" y="158" width="420" height="122" rx="6" fill="#0b192c" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="950" y="158" width="66" height="122" fill="#0c2d48"/>
  <text x="983" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">D1</text>
  <text x="1193" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Data Store: products</text>
  <text x="1193" y="220" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="400" fill="#7dd3fc">list[dict] in RAM</text>
  <text x="1193" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">id, name, category, price, stock</text>
  <rect x="950" y="382" width="420" height="122" rx="6" fill="#0b192c" stroke="#34d399" stroke-width="1.8"/>
  <rect x="950" y="382" width="66" height="122" fill="#08362c"/>
  <text x="983" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#34d399">D2</text>
  <text x="1193" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Data Store: sales_records</text>
  <text x="1193" y="444" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="400" fill="#6ee7b7">list[dict] in RAM</text>
  <text x="1193" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#cbd5e1">product_id, product_name, quantity_sold, total_amount</text>
  <path d="M 245 270 L 357 197" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrowCyan)"/>
  <text x="296" y="218" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="400" fill="#7dd3fc">catalog / stock</text>
  <path d="M 245 332 L 357 351" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrowEmerald)"/>
  <text x="298" y="330" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="400" fill="#6ee7b7">sale ID &amp; qty</text>
  <path d="M 245 395 L 357 510" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <text x="294" y="468" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="400" fill="#fde68a">report req</text>
  <path d="M 800 192 L 947 206" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrowCyan)"/>
  <text x="874" y="188" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="400" fill="#7dd3fc">add / update</text>
  <path d="M 800 335 L 947 254" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>
  <text x="875" y="282" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="400" fill="#7dd3fc">read &amp; deduct</text>
  <path d="M 800 382 L 947 421" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrowEmerald)"/>
  <text x="874" y="392" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="400" fill="#6ee7b7">append sale</text>
  <path d="M 950 272 L 802 480" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>
  <path d="M 950 452 L 803 527" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>
  <text x="884" y="514" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="400" fill="#fde68a">read D1 &amp; D2</text>

  <line x1="24" y1="612" x2="1376" y2="612" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="634" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Assessment 03: Smart Grocery Store Management System (smart_grocery_store.py) • Accurate Procedural &amp; In-Memory State Model</text>
  <text x="1372" y="634" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">aliabbas0014/smart-grocery-store-system</text>
</svg>
