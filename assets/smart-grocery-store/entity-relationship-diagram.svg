<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" width="1400" height="680" role="img" aria-label="Entity Relationship &amp; Data Model Diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="55%" stop-color="#0d172a"/>
      <stop offset="100%" stop-color="#081120"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13223b"/>
      <stop offset="100%" stop-color="#0f1b30"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.10"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#fbbf24"/>
    </marker>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1400" height="680" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1400" height="680" rx="16" fill="url(#gridPattern)"/>
  <rect x="1" y="1" width="1398" height="678" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <rect x="24" y="20" width="1352" height="74" rx="12" fill="url(#headerGrad)" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="24" y="20" width="6" height="74" rx="3" fill="url(#accentBlue)"/>
  <text x="46" y="51" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Entity Relationship &amp; Data Model Diagram</text>
  <text x="46" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">In-memory list-of-dictionaries schema for products and sales_records in smart_grocery_store.py</text>

  <rect x="1165" y="38" width="188" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="1259" y="59" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">Python 3 • Procedural CLI</text>

  <rect x="24" y="108" width="1352" height="38" rx="8" fill="#0f2942" stroke="#22d3ee" stroke-width="1"/>
  <text x="38" y="132" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#bae6fd">In-Memory Data Model: Two Python list[dict] collections in RAM — no SQL tables or external database. Logical link: product[&quot;id&quot;] == sale[&quot;product_id&quot;].</text>
  <rect x="44" y="164" width="545" height="342" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="44" y="164" width="545" height="40" rx="12" fill="#0c2d48"/>
  <text x="316" y="189" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">COLLECTION 1: products (list of Product dicts)</text>
  <rect x="62" y="216" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="74" y="238" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">ID   &quot;id&quot;       : int</text>
  <text x="275" y="238" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Unique positive integer (&gt; 0)</text>
  <rect x="62" y="256" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="74" y="278" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="400" fill="#7dd3fc">     &quot;name&quot;     : str</text>
  <text x="275" y="278" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Non-empty product name (.strip())</text>
  <rect x="62" y="296" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="74" y="318" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="400" fill="#7dd3fc">     &quot;category&quot; : str</text>
  <text x="275" y="318" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Non-empty category (.strip())</text>
  <rect x="62" y="336" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="74" y="358" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="400" fill="#7dd3fc">     &quot;price&quot;    : float</text>
  <text x="275" y="358" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Unit price (&gt; 0.0), shown in Rs.</text>
  <rect x="62" y="376" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="74" y="398" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="400" fill="#7dd3fc">     &quot;stock&quot;    : int</text>
  <text x="275" y="398" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Stock units (&gt;= 0); low alert &lt; 5</text>
  <text x="62" y="438" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Writers: add_product(), update_stock(), process_sale()</text>
  <text x="62" y="458" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Readers: find_product(), display_products(), search_product(), generate_report()</text>
  <text x="62" y="478" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Storage: In-memory session list (reset on program restart)</text>
  <line x1="589" y1="233" x2="811" y2="233" stroke="#34d399" stroke-width="2.2"/>
  <text x="606" y="224" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#34d399">1</text>
  <text x="782" y="224" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#34d399">0..N</text>
  <rect x="625" y="244" width="150" height="48" rx="8" fill="#08362c" stroke="#34d399" stroke-width="1.3"/>
  <text x="700" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#6ee7b7">sale references</text>
  <text x="700" y="282" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="400" fill="#a7f3d0">id == product_id</text>
  <rect x="811" y="164" width="545" height="342" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.8"/>
  <rect x="811" y="164" width="545" height="40" rx="12" fill="#08362c"/>
  <text x="1083" y="189" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">COLLECTION 2: sales_records (list of Sale dicts)</text>
  <rect x="829" y="216" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="841" y="238" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">REF  &quot;product_id&quot;    : int</text>
  <text x="1065" y="238" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Matches product[&quot;id&quot;]</text>
  <rect x="829" y="256" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="841" y="278" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="400" fill="#6ee7b7">     &quot;product_name&quot;  : str</text>
  <text x="1065" y="278" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Product name at sale time</text>
  <rect x="829" y="296" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="841" y="318" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="400" fill="#6ee7b7">     &quot;quantity_sold&quot; : int</text>
  <text x="1065" y="318" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Purchased units (&gt; 0, &lt;= stock)</text>
  <rect x="829" y="336" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="841" y="358" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="400" fill="#6ee7b7">     &quot;total_amount&quot;  : float</text>
  <text x="1065" y="358" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Calculated: price * quantity_sold</text>
  <rect x="829" y="376" width="509" height="34" rx="6" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="841" y="398" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Appended via sales_records.append(sale) in process_sale()</text>
  <text x="829" y="438" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Readers: view_sales_records(), generate_report()</text>
  <text x="829" y="458" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">No deletion or update operations on past sales records</text>
  <text x="829" y="478" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Storage: In-memory session list (reset on program restart)</text>
  <rect x="44" y="524" width="1312" height="96" rx="10" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="64" y="550" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">REPORT CALCULATIONS IN generate_report()</text>
  <text x="64" y="574" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#e2e8f0">• Counts &amp; Sums: len(products) [total products], sum(p[&quot;stock&quot;]) [total stock], len(sales_records) [transactions], sum(s[&quot;total_amount&quot;]) [revenue]</text>
  <text x="64" y="598" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#e2e8f0">• Low Stock &amp; Price Range: products where p[&quot;stock&quot;] &lt; 5; highest/lowest price via max(products, key=lambda p: p[&quot;price&quot;]) and min(products, key=lambda p: p[&quot;price&quot;])</text>

  <line x1="24" y1="642" x2="1376" y2="642" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="664" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Assessment 03: Smart Grocery Store Management System (smart_grocery_store.py) • Accurate Procedural &amp; In-Memory State Model</text>
  <text x="1372" y="664" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">aliabbas0014/smart-grocery-store-system</text>
</svg>
