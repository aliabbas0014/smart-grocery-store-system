<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 670" width="1400" height="670" role="img" aria-label="System Architecture Diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="55%" stop-color="#0d172a"/>
      <stop offset="100%" stop-color="#081120"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13223b"/>
      <stop offset="100%" stop-color="#0f1b30"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.10"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#fbbf24"/>
    </marker>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1400" height="670" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1400" height="670" rx="16" fill="url(#gridPattern)"/>
  <rect x="1" y="1" width="1398" height="668" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <rect x="24" y="20" width="1352" height="74" rx="12" fill="url(#headerGrad)" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="24" y="20" width="6" height="74" rx="3" fill="url(#accentBlue)"/>
  <text x="46" y="51" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">System Architecture Diagram</text>
  <text x="46" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">Three-tier in-process architecture: CLI I/O, Procedural Logic, and In-Memory Lists of Dictionaries</text>

  <rect x="1165" y="38" width="188" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="1259" y="59" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">Python 3 • Procedural CLI</text>

  <rect x="36" y="120" width="1328" height="128" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.6"/>
  <rect x="36" y="120" width="220" height="128" rx="12" fill="#0c2d48"/>
  <text x="146" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">1. CLI I/O TIER</text>
  <text x="146" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Console stdin / stdout</text>
  <rect x="278" y="140" width="335" height="88" rx="8" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="445" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">Main Menu Loop (while True)</text>
  <text x="445" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Prints options 1-8; reads &amp; strips choice</text>
  <text x="445" y="210" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="400" fill="#7dd3fc">Dispatches via if / elif branches</text>
  <rect x="633" y="140" width="350" height="88" rx="8" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="808" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">Console Prompts &amp; Display</text>
  <text x="808" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Prompts for ID, name, category, price, qty</text>
  <text x="808" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Prints products, receipts, alerts &amp; reports</text>
  <rect x="1003" y="140" width="340" height="88" rx="8" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="1173" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">Validation &amp; Error Guards</text>
  <text x="1173" y="190" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="400" fill="#7dd3fc">get_positive_integer() + ValueError catch</text>
  <text x="1173" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Rejects empty strings, negative/zero values</text>
  <path d="M 700 248 L 700 282" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="36" y="288" width="1328" height="142" rx="12" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="1.6"/>
  <rect x="36" y="288" width="220" height="142" rx="12" fill="#0b3446"/>
  <text x="146" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">2. PROCEDURAL LOGIC</text>
  <text x="146" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">9 Python Functions</text>
  <rect x="278" y="308" width="252" height="102" rx="8" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="404" y="334" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">add_product()</text>
  <text x="404" y="354" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">find_product(id)</text>
  <text x="404" y="374" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">search_product()</text>
  <text x="404" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Catalog creation &amp; lookup</text>
  <rect x="550" y="308" width="252" height="102" rx="8" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="676" y="340" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">update_stock()</text>
  <text x="676" y="364" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">display_products()</text>
  <text x="676" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Stock updates &amp; catalog view</text>
  <rect x="822" y="308" width="252" height="102" rx="8" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="948" y="340" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">process_sale()</text>
  <text x="948" y="364" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">view_sales_records()</text>
  <text x="948" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Checkout &amp; sales history</text>
  <rect x="1094" y="308" width="249" height="102" rx="8" fill="#0b192c" stroke="#1e3a5f"/>
  <text x="1218" y="340" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#fde68a">generate_report()</text>
  <text x="1218" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Totals, revenue, low stock (&lt;5)</text>
  <text x="1218" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">&amp; highest/lowest price</text>
  <path d="M 700 430 L 700 464" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <rect x="36" y="470" width="1328" height="138" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.6"/>
  <rect x="36" y="470" width="220" height="138" rx="12" fill="#08362c"/>
  <text x="146" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">3. IN-MEMORY STATE</text>
  <text x="146" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Python RAM Lists</text>
  <rect x="278" y="490" width="524" height="98" rx="8" fill="#0b192c" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="540" y="520" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">products = [ {id, name, category, price, stock}, ... ]</text>
  <text x="540" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Mutable list of product dicts held in memory during runtime</text>
  <text x="540" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">No database or file persistence in smart_grocery_store.py</text>
  <rect x="822" y="490" width="521" height="98" rx="8" fill="#0b192c" stroke="#34d399" stroke-width="1.2"/>
  <text x="1082" y="520" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" fill="#6ee7b7">sales_records = [ {product_id, product_name, quantity_sold, total_amount}, ... ]</text>
  <text x="1082" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Append-only list of sale dicts recorded per completed sale</text>
  <text x="1082" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Queried by view_sales_records() and generate_report()</text>

  <line x1="24" y1="632" x2="1376" y2="632" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="654" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Assessment 03: Smart Grocery Store Management System (smart_grocery_store.py) • Accurate Procedural &amp; In-Memory State Model</text>
  <text x="1372" y="654" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">aliabbas0014/smart-grocery-store-system</text>
</svg>
