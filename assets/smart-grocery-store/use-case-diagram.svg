  <text x="915" y="443" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">UC8: Exit System</text>
  <ellipse cx="700" cy="552" rx="245" ry="28" fill="#13223b" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="4,3"/>
