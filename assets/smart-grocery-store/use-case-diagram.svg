  <text x="130" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Store Operator</text>
  <line x1="46" y1="288" x2="215" y2="288" stroke="#1e3a5f"/>
  <text x="130" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#cbd5e1">Uses CLI menu (1-8)</text>
  <text x="130" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#cbd5e1">and interactive prompts</text>
  <text x="130" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#cbd5e1">in terminal session</text>
  <rect x="262" y="114" width="876" height="506" rx="14" fill="#091324" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="8,5"/>
  <text x="700" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">SYSTEM BOUNDARY: SMART GROCERY STORE MANAGEMENT SYSTEM</text>
  <ellipse cx="485" cy="198" rx="175" ry="27" fill="url(#accentCyan)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="485" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">UC1: Add New Product</text>
  <ellipse cx="485" cy="278" rx="175" ry="27" fill="url(#accentCyan)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="485" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">UC2: View All Products</text>
  <ellipse cx="485" cy="358" rx="175" ry="27" fill="url(#accentCyan)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="485" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">UC3: Search Product (ID/Name)</text>
  <ellipse cx="485" cy="438" rx="175" ry="27" fill="url(#accentCyan)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="485" y="443" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">UC4: Update Product Stock</text>
