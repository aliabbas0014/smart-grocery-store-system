  <path d="M 915 225 L 792 523" fill="none" stroke="#34d399" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowEmerald)"/>
  <rect x="1164" y="122" width="212" height="490" rx="12" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="1270" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8">SYSTEM RULES</text>
  <text x="1178" y="184" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">• Duplicate IDs blocked</text>
  <text x="1178" y="214" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">• Search by ID or Name</text>
  <text x="1178" y="244" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">• Add or set stock (&gt;= 0)</text>
  <text x="1178" y="274" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">• Reject sale if qty &gt; stock</text>
  <text x="1178" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">• Log sale &amp; deduct stock</text>
  <text x="1178" y="334" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">• Report flags stock &lt; 5</text>
  <text x="1178" y="364" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">• Report shows min/max</text>
  <text x="1188" y="380" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">priced products</text>

  <line x1="24" y1="642" x2="1376" y2="642" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="664" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Assessment 03: Smart Grocery Store Management System (smart_grocery_store.py) • Accurate Procedural &amp; In-Memory State Model</text>
  <text x="1372" y="664" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">aliabbas0014/smart-grocery-store-system</text>
