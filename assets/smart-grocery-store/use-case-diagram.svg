  <text x="915" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">UC5: Process Customer Sale</text>
  <ellipse cx="915" cy="278" rx="175" ry="27" fill="url(#accentEmerald)" stroke="#34d399" stroke-width="1.5"/>
  <text x="915" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">UC6: View Sales Records</text>
  <ellipse cx="915" cy="358" rx="175" ry="27" fill="url(#accentAmber)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="915" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">UC7: Generate Store Report</text>
