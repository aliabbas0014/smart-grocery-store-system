<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" width="1400" height="680" role="img" aria-label="Procedural Structure &amp; Module Diagram (UML Equivalent)">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="55%" stop-color="#0d172a"/>
      <stop offset="100%" stop-color="#081120"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13223b"/>
      <stop offset="100%" stop-color="#0f1b30"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.10"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#fbbf24"/>
    </marker>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1400" height="680" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1400" height="680" rx="16" fill="url(#gridPattern)"/>
  <rect x="1" y="1" width="1398" height="678" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <rect x="24" y="20" width="1352" height="74" rx="12" fill="url(#headerGrad)" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="24" y="20" width="6" height="74" rx="3" fill="url(#accentBlue)"/>
  <text x="46" y="51" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Procedural Structure &amp; Module Diagram (UML Equivalent)</text>
  <text x="46" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">Actual functions, data structures, and menu dispatch in smart_grocery_store.py (no OOP classes)</text>

  <rect x="1165" y="38" width="188" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="1259" y="59" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">Python 3 • Procedural CLI</text>

  <rect x="24" y="108" width="1352" height="38" rx="8" fill="#0f2942" stroke="#38bdf8" stroke-width="1"/>
  <text x="38" y="132" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#bae6fd">Procedural Architecture Note: Implemented in smart_grocery_store.py using global lists of dicts (products, sales_records) and procedural functions — no OOP classes or database.</text>
  <rect x="24" y="162" width="415" height="268" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.6"/>
  <rect x="24" y="162" width="415" height="36" rx="10" fill="#0c2d48"/>
  <text x="231" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">&lt;&lt;module&gt;&gt; smart_grocery_store.py (State)</text>
  <line x1="24" y1="198" x2="439" y2="198" stroke="#38bdf8" stroke-width="1"/>
  <text x="38" y="219" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">MODULE DATA STRUCTURES (LIST OF DICTS)</text>
  <text x="38" y="240" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">+ products: list[dict] = []</text>
  <text x="50" y="258" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">keys: id (int), name (str), category (str),</text>
  <text x="50" y="274" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">price (float), stock (int)</text>
  <text x="38" y="297" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#34d399">+ sales_records: list[dict] = []</text>
  <text x="50" y="315" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">keys: product_id (int), product_name (str),</text>
  <text x="50" y="331" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">quantity_sold (int), total_amount (float)</text>
  <line x1="24" y1="345" x2="439" y2="345" stroke="#1e3a5f" stroke-width="1"/>
  <text x="38" y="365" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">HELPER &amp; VALIDATION FUNCTIONS</text>
  <text x="38" y="386" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="400" fill="#7dd3fc">+ find_product(product_id: int) -&gt; dict | None</text>
  <text x="38" y="406" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="400" fill="#7dd3fc">+ get_positive_integer(message: str) -&gt; int</text>
  <rect x="464" y="162" width="452" height="268" rx="10" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="1.6"/>
  <rect x="464" y="162" width="452" height="36" rx="10" fill="#0b3446"/>
  <text x="690" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">&lt;&lt;procedural group&gt;&gt; Catalog &amp; Stock Functions</text>
  <line x1="464" y1="198" x2="916" y2="198" stroke="#22d3ee" stroke-width="1"/>
  <text x="480" y="222" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#7dd3fc">+ add_product() -&gt; None</text>
  <text x="492" y="240" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Validates unique ID, non-empty name/cat, price &gt; 0, stock &gt;= 0</text>
  <text x="480" y="268" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#7dd3fc">+ display_products() -&gt; None</text>
  <text x="492" y="286" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Loops over products; prints ID, name, category, price, stock</text>
  <text x="480" y="314" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#7dd3fc">+ search_product() -&gt; None</text>
  <text x="492" y="332" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Searches by ID (I/i) or case-insensitive Name (N/n)</text>
  <text x="480" y="360" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#7dd3fc">+ update_stock() -&gt; None</text>
  <text x="492" y="378" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Option 1: adds positive qty | Option 2: sets new stock (&gt;= 0)</text>
  <rect x="940" y="162" width="436" height="268" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.6"/>
  <rect x="940" y="162" width="436" height="36" rx="10" fill="#08362c"/>
  <text x="1158" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">&lt;&lt;procedural group&gt;&gt; Sales &amp; Report Functions</text>
  <line x1="940" y1="198" x2="1376" y2="198" stroke="#34d399" stroke-width="1"/>
  <text x="956" y="224" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#6ee7b7">+ process_sale() -&gt; None</text>
  <text x="968" y="242" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Checks product &amp; stock &gt;= qty; computes price*qty;</text>
  <text x="968" y="258" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">deducts stock; appends dict to sales_records</text>
  <text x="956" y="288" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#6ee7b7">+ view_sales_records() -&gt; None</text>
  <text x="968" y="306" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Loops over sales_records; prints product_id, name,</text>
  <text x="968" y="322" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">quantity_sold, and total_amount</text>
  <text x="956" y="352" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#6ee7b7">+ generate_report() -&gt; None</text>
  <text x="968" y="370" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">Totals products, stock, sales &amp; revenue; flags stock &lt; 5;</text>
  <text x="968" y="386" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">finds highest/lowest priced product via max()/min()</text>
  <rect x="24" y="452" width="1352" height="172" rx="10" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.6"/>
  <rect x="24" y="452" width="1352" height="34" rx="10" fill="#3a2808"/>
  <text x="700" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#fde68a">&lt;&lt;entry loop&gt;&gt; Main Console Menu Dispatcher (while True)</text>
  <text x="42" y="508" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="400" fill="#7dd3fc">choice = input(&quot;\nEnter your choice: &quot;).strip()</text>
  <text x="42" y="532" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#e2e8f0">Dispatch:  &quot;1&quot; -&gt; add_product()   |  &quot;2&quot; -&gt; display_products()   |  &quot;3&quot; -&gt; search_product()   |  &quot;4&quot; -&gt; update_stock()</text>
  <text x="42" y="556" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#e2e8f0">           &quot;5&quot; -&gt; process_sale()    |  &quot;6&quot; -&gt; view_sales_records() |  &quot;7&quot; -&gt; generate_report()  |  &quot;8&quot; -&gt; break (Exit)</text>
  <text x="42" y="582" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">Other inputs print &quot;Invalid choice! Please select between 1 and 8.&quot; and continue the loop.</text>
  <text x="42" y="604" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">No classes, inheritance, or external database drivers are present in smart_grocery_store.py.</text>
  <path d="M 231 452 L 231 434" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowCyan)"/>
  <path d="M 690 452 L 690 434" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowCyan)"/>
  <path d="M 1158 452 L 1158 434" fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowEmerald)"/>
  <path d="M 439 296 L 461 296" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <path d="M 916 296 L 937 296" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowEmerald)"/>

  <line x1="24" y1="642" x2="1376" y2="642" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="664" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Assessment 03: Smart Grocery Store Management System (smart_grocery_store.py) • Accurate Procedural &amp; In-Memory State Model</text>
  <text x="1372" y="664" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#7dd3fc">aliabbas0014/smart-grocery-store-system</text>
</svg>
